<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <span class="logo">🎬</span>
      <span class="title">Cursor Capture</span>
    </div>

    <!-- Command input panel -->
    <div id="panel-command" class="panel">
      <div class="history-row" id="history-row" hidden>
        <label class="field-label" for="history-select">Recent</label>
        <select id="history-select" class="history-select">
          <option value="">— load script —</option>
        </select>
      </div>

      <label class="field-label" for="cmd-input">Commands</label>
      <textarea
        id="cmd-input"
        class="cmd-textarea"
        spellcheck="false"
        placeholder='click "Payment Links"
click "+ New Payment Link"
type "Summer Sale" in "Link Title"
click "Create"'
      ></textarea>

      <div class="parse-errors" id="parse-errors"></div>

      <div class="btn-row">
        <button class="btn-dry" id="btn-dry" disabled>Dry Run</button>
        <button class="btn-run" id="btn-run" disabled>▶ Run &amp; Record</button>
      </div>
    </div>

    <!-- Running / dry-run status panel -->
    <div id="panel-running" class="panel" hidden>
      <div class="status-row">
        <span class="status-dot status-recording" id="status-dot"></span>
        <span class="status-label" id="status-label">Starting…</span>
      </div>
      <div class="progress-row">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-text" id="progress-text">0 / 0</span>
      </div>
      <div class="step-desc" id="step-desc"></div>

      <!-- Dry-run checklist (hidden during real run) -->
      <ul class="dry-checklist" id="dry-checklist"></ul>

      <button class="btn-cancel" id="btn-cancel">Cancel</button>
    </div>

    <!-- Done panel -->
    <div id="panel-done" class="panel" hidden>
      <div class="done-msg">
        <span class="done-icon">✓</span>
        Recording saved. Open the Editor to polish and export.
      </div>
    </div>

    <!-- Error panel -->
    <div id="panel-error" class="panel" hidden>
      <div class="error-msg" id="error-msg"></div>
      <button class="btn-back" id="btn-back">← Back</button>
    </div>

    <hr class="divider" />
    <button class="btn-editor" id="btn-editor">Open Editor →</button>

    <script type="module" src="popup.ts"></script>
  </body>
</html>
